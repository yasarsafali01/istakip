services:
  postgres:
    image: postgres:16-alpine
    # Sunucu yeniden başladığında veritabanı da otomatik açılır.
    restart: unless-stopped
    environment:
      POSTGRES_USER: istakip
      POSTGRES_PASSWORD: istakip
      POSTGRES_DB: istakip
    # Yalnızca makinenin kendisinden erişilebilir. Docker, ufw kurallarını
    # atladığı için 0.0.0.0'a açmak veritabanını tüm ağa açardı.
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - istakip_pg_data:/var/lib/postgresql/data

volumes:
  istakip_pg_data:
