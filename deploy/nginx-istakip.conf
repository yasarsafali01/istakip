server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /var/www/istakip;
    index index.html;

    # React Router (BrowserRouter): bilinmeyen yollar index.html'e düşer,
    # böylece /requests gibi sayfalar yenilenince 404 vermez.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Derlenen JS/CSS dosya adları içerik hash'i taşır; uzun süre önbelleğe alınabilir.
    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html her seferinde yeniden alınsın ki güncellemeler hemen görünsün.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
